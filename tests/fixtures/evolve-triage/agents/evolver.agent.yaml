apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: evolve-triage-evolver
  description: "Evolver agent for triage self-evolution effect validation"

models:
  providers:
    primary:
      type: mock
      model: mock-react
      temperature: 0
      maxOutputTokens: 4096
      contextWindow: 32768
      timeoutSec: 120

instructions:
  system: ../prompts/evolver.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 4
    maxDurationSec: 180
    maxToolCalls: 0
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/evolver

permissions:
  access: readOnly
  approval: onRequest
