apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: verifier
  description: "Worker agent for checking synthesis readiness"

models:
  providers:
    primary:
      type: mock
      model: mock

instructions:
  system: ../prompts/verifier.md

runtime:
  model: primary
  loop:
    type: react
  limits:
    maxSteps: 6
    maxDurationSec: 120
    maxToolCalls: 4
    maxConsecutiveErrors: 4

workspace:
  path: ../workspace/research

tools:
  []

permissions:
  access: readOnly
  approval: never

evaluate:
  enabled: true
  evaluators:
    - name: basic
      uses: rules
      rules:
        - finalAnswerExists
        - runCompleted
