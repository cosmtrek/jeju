apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: agent
  description: "Full fixture agent for local runtime tests"

models:
  providers:
    primary:
      type: mock
      model: mock-react
      temperature: 0.2
      maxOutputTokens: 4096
      timeoutSec: 120

instructions:
  system: ../prompts/agent.md

runtime:
  model: primary
  loop:
    type: react
  limits:
    maxSteps: 8
    maxDurationSec: 300
    maxToolCalls: 10
    maxConsecutiveErrors: 3

workspace:
  path: ../workspace/agent

tools:
  - write

  - name: keyword_count
    uses: command
    description: "Example custom command tool that counts keyword occurrences in text"
    capabilities:
      - workspaceRead
    command:
      run: ../workspace/agent/tools/keyword_count.py
      args:
        - --text
        - "{{text}}"
        - --keyword
        - "{{keyword}}"
        - --case-sensitive
        - "{{case_sensitive}}"
      timeoutSec: 10
    input:
      schema:
        type: object
        required:
          - text
          - keyword
        properties:
          text:
            type: string
            description: "Text to search"
          keyword:
            type: string
            description: "Keyword to count"
          case_sensitive:
            type: boolean
            description: "Whether matching should be case sensitive"
            default: false

skills:
  dirs:
    - ../skills
  active:
    - agent-writer

permissions:
  access: workspace
  approval: onRequest

evaluate:
  enabled: true
  evaluators:
    - name: basic_trajectory
      uses: rules
      rules:
        - finalAnswerExists
        - noModelError
        - maxStepsNotExceeded
        - maxToolCallsNotExceeded
        - noPermissionDenied
        - runCompleted
