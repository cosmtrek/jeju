apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: evolve-marker-support
  description: "Target agent for the self-evolution marker E2E fixture"

models:
  providers:
    primary:
      type: mock
      model: mock-react
      temperature: 0.1
      maxOutputTokens: 1024
      contextWindow: 32768
      timeoutSec: 120

instructions:
  system: ../prompts/support.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 4
    maxDurationSec: 180
    maxToolCalls: 0
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/support

permissions:
  access: readOnly
  approval: onRequest
