apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: article-rewriter
  description: "Rewrite an article according to concrete editorial suggestions and output the revised draft directly"

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-pro
      envKey: DEEPSEEK_API_KEY
      temperature: 0.2
      thinking:
        type: disabled
      maxOutputTokens: 8192
      contextWindow: 128000
      timeoutSec: 120

instructions:
  system: ../prompts/article-rewriter.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 20
    maxDurationSec: 420
    maxToolCalls: 30
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace

tools:
  - read
  - search

permissions:
  access: readOnly
  approval: never

evaluate:
  enabled: true
  evaluators:
    - name: basic
      uses: rules
      rules:
        - finalAnswerExists
        - runCompleted
