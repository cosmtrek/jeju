apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: terminal-lite
  description: "Jeju Terminal Lite benchmark agent"

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-flash
      envKey: DEEPSEEK_API_KEY
      temperature: 0.1
      maxOutputTokens: 4096
      timeoutSec: 180

instructions:
  system: ../prompts/benchmark.md

runtime:
  model: primary
  loop:
    type: react
  limits:
    maxSteps: 18
    maxDurationSec: 600
    maxToolCalls: 16
    maxConsecutiveErrors: 4

workspace:
  path: ../workspace/app

tools:
  - read
  - write
  - shell

permissions:
  access: workspace
  approval: onRequest

evaluate:
  enabled: true
  evaluators:
    - name: terminal_lite_runtime
      uses: rules
      rules:
        - finalAnswerExists
        - noModelError
        - maxStepsNotExceeded
        - maxToolCallsNotExceeded
        - noPermissionDenied
        - runCompleted
