apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: code-review
  description: "Repeatable code review agent for structured diff review"
  labels:
    scenario: personal-agent
    use_case: code-review

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-pro
      envKey: DEEPSEEK_API_KEY
      temperature: 0.1
      thinking:
        type: disabled
      maxOutputTokens: 4096
      contextWindow: 128000
      timeoutSec: 90

instructions:
  system: ../prompts/code-review.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 100
    maxDurationSec: 180
    maxToolCalls: 100
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace

tools:
  - read
  - search

  - name: git_status
    uses: command
    description: "Show current working tree changes with git status --short."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["status", "--short"]
      timeoutSec: 20

  - name: git_diff
    uses: command
    description: "Show unstaged working tree diff. Optionally restrict to one path."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--", "{{path}}"]
      timeoutSec: 30
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to diff."

  - name: git_diff_cached
    uses: command
    description: "Show staged diff. Optionally restrict to one path."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--cached", "--", "{{path}}"]
      timeoutSec: 30
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to diff."

permissions:
  access: readOnly
  approval: never
