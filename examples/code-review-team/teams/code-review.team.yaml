apiVersion: jeju/v1alpha1
kind: AgentTeam

metadata:
  name: code-review-team
  description: "Lean lead-worker code review team: one packet builder, one generalist reviewer dispatched with lead-chosen focuses, one judge verifier."

lead:
  agent: ../agents/review-lead.agent.yaml
  description: "Plan packet build, choose 1-3 review focuses for the diff, and select the final answer."

workers:
  packet_builder:
    agent: ../agents/packet-builder.agent.yaml
    description: "Build the single review evidence packet from the target workspace diff."
    maxTasks: 1

  reviewer:
    agent: ../agents/reviewer.agent.yaml
    description: "Generalist reviewer; the lead assigns each task a distinct focus (correctness, security, tests, conventions)."
    maxTasks: 4

  verifier:
    agent: ../agents/verifier.agent.yaml
    description: "Judge: dedup findings across reviewer tasks, verify claims against evidence, score confidence, gate final output."
    maxTasks: 2

  writer:
    agent: ../agents/review-writer.agent.yaml
    description: "Write the final Markdown review from verified verifier output."
    maxTasks: 1

runtime:
  topology: lead_worker
  maxRounds: 8
  maxTasks: 11
  maxParallel: 3
  maxRetriesPerTask: 1
  maxConsecutiveEmptyRounds: 1

verification:
  requireStructuredTaskOutput: true
  requireVerifier: true
  requiredTaskFields:
    - summary
    - findings
    - evidence
    - gaps
    - residual_risk

output:
  dir: ../../../.jeju-dev/team/code-review-team
