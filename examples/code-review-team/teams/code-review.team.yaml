apiVersion: jeju/v1alpha1
kind: AgentTeam

metadata:
  name: code-review-team
  description: "Manifest-only lead-worker code review team with packet-builder worker and packet-scoped reviewers."

lead:
  agent: ../agents/review-lead.agent.yaml
  synthesisAgent: ../agents/review-synthesis.agent.yaml
  description: "Plan packet build, specialist reviews, verifier checks, and final synthesis."

workers:
  packet_builder:
    agent: ../agents/packet-builder.agent.yaml
    description: "Build review evidence packets from the target workspace diff using bundled tools."
    maxTasks: 1

  diff_context_reviewer:
    agent: ../agents/diff-context-reviewer.agent.yaml
    description: "Review changed-file scope and diff context using only the diff_context packet."
    maxTasks: 2

  runtime_correctness_reviewer:
    agent: ../agents/runtime-correctness-reviewer.agent.yaml
    description: "Review runtime correctness using only the runtime_correctness packet."
    maxTasks: 2

  safety_policy_reviewer:
    agent: ../agents/safety-policy-reviewer.agent.yaml
    description: "Review safety, permissions, policy, and sandbox risks using only the safety_policy packet."
    maxTasks: 2

  tests_docs_reviewer:
    agent: ../agents/tests-docs-reviewer.agent.yaml
    description: "Review tests, fixtures, docs, and validation gaps using only the tests_docs packet."
    maxTasks: 2

  static_analysis_reviewer:
    agent: ../agents/static-analysis-reviewer.agent.yaml
    description: "Review deterministic check results using only the static_analysis packet."
    maxTasks: 2

  verifier:
    agent: ../agents/verifier.agent.yaml
    description: "Cross-check worker outputs against packets, reject unsupported findings, and mark synthesis readiness."
    maxTasks: 2

runtime:
  topology: lead_worker
  maxRounds: 8
  maxTasks: 12
  maxParallel: 3
  maxRetriesPerTask: 1
  maxConsecutiveEmptyRounds: 1

verification:
  requireStructuredTaskOutput: true
  requireVerifier: true
  requiredTaskFields:
    - summary
    - findings
    - evidence
    - gaps
    - residual_risk

output:
  dir: ../../../.jeju-dev/team/code-review-team
