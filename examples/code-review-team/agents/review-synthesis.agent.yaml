apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: review-synthesis
  description: "Synthesis agent for packet-first code review team."

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-flash
      envKey: DEEPSEEK_API_KEY
      temperature: 0.1
      thinking:
        type: disabled
      maxOutputTokens: 8192
      contextWindow: 128000
      timeoutSec: 120

instructions:
  system: ../prompts/review-synthesis.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  recentTokenBudget: 30000
  limits:
    maxSteps: 3
    maxDurationSec: 180
    maxToolCalls: 0
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/review

tools:
  []

permissions:
  access: readOnly
  approval: never

evaluate:
  enabled: true
  evaluators:
    - name: basic
      uses: rules
      rules: [finalAnswerExists, runCompleted]
