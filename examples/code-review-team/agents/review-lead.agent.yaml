apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: review-lead
  description: "Lead agent for the code review team: plans review focuses and decides when to finish."

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-pro
      envKey: DEEPSEEK_API_KEY
      temperature: 0.1
      thinking:
        type: disabled
      maxOutputTokens: 4096
      contextWindow: 128000
      timeoutSec: 120

instructions:
  system: ../prompts/review-lead.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  recentTokenBudget: 24000
  limits:
    maxSteps: 4
    maxDurationSec: 180
    maxToolCalls: 0
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/review

tools:
  []

permissions:
  access: readOnly
  approval: never

evaluate:
  enabled: true
  evaluators:
    - name: basic
      uses: rules
      rules: [finalAnswerExists, runCompleted]
