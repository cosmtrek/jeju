apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: safety-policy-reviewer
  description: "Safety and policy reviewer for packet-first code review."

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-flash
      envKey: DEEPSEEK_API_KEY
      temperature: 0.1
      thinking:
        type: disabled
      maxOutputTokens: 4096
      contextWindow: 128000
      timeoutSec: 120

instructions:
  system: ../prompts/safety-policy-reviewer.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  recentTokenBudget: 20000
  limits:
    maxSteps: 4
    maxDurationSec: 180
    maxToolCalls: 2
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/review

tools:
  - name: get_review_packet
    uses: command
    description: "Return the safety_policy review packet for this workspace."
    capabilities: [workspaceRead]
    command:
      run: ../tools/cr-packet.py
      args: ["packet", "--run-id", "{{run_id}}", "--dimension", "safety_policy"]
      timeoutSec: 20
    input:
      schema:
        type: object
        properties:
          run_id:
            type: string
            default: current
            description: "Packet run_id from the build-review-packets task."

permissions:
  access: readOnly
  approval: never

evaluate:
  enabled: true
  evaluators:
    - name: basic
      uses: rules
      rules: [finalAnswerExists, runCompleted]
