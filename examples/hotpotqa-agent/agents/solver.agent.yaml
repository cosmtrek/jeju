apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: hotpotqa-solver
  description: "Multi-hop QA solver evaluated with official HotpotQA answer EM/F1"

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-flash
      temperature: 0.0
      thinking:
        type: disabled
      maxOutputTokens: 1024
      contextWindow: 128000
      timeoutSec: 120

instructions:
  system: ../prompts/solver.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 4
    maxDurationSec: 180
    maxToolCalls: 0
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/solver

permissions:
  access: readOnly
  approval: onRequest

evaluate:
  enabled: true
  evaluators:
    - name: hotpotqa_em_f1
      uses: command
      command:
        run: ../eval/hotpotqa_em_f1.py
        timeoutSec: 20
