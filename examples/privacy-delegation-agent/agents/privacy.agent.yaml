apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: privacy-delegation-target
  description: "Target privacy delegation agent for evaluation-guided improvement demo"

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-flash
      temperature: 0.2
      thinking:
        type: disabled
      maxOutputTokens: 2048
      contextWindow: 128000
      timeoutSec: 120

instructions:
  system: ../prompts/privacy.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 4
    maxDurationSec: 180
    maxToolCalls: 0
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/privacy

permissions:
  access: readOnly
  approval: onRequest

evaluate:
  enabled: true
  evaluators:
    - name: privacy_judge
      uses: command
      command:
        run: ../eval/privacy_judge.py
        timeoutSec: 20
