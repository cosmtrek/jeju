apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: skillsbench-lite-evolver
  description: "Evolver agent for the SkillsBench-like harness activation demo"

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-flash
      temperature: 0.1
      thinking:
        type: disabled
      maxOutputTokens: 4096
      contextWindow: 128000
      timeoutSec: 120

instructions:
  system: ../prompts/evolver.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 4
    maxDurationSec: 180
    maxToolCalls: 0
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace/evolver

permissions:
  access: readOnly
  approval: onRequest
