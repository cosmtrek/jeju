apiVersion: jeju/v1alpha1
kind: Agent

metadata:
  name: code-review
  description: "Repeatable code review agent for structured diff review"
  labels:
    scenario: personal-agent
    example: code-review

models:
  providers:
    primary:
      type: openaiCompatible
      preset: deepseek
      model: deepseek-v4-pro
      envKey: DEEPSEEK_API_KEY
      temperature: 0.1
      thinking:
        type: disabled
      maxOutputTokens: 4096
      contextWindow: 128000
      timeoutSec: 90

instructions:
  system: ../prompts/code-review.md

runtime:
  model: primary
  loop:
    type: react
  compressionThreshold: 0.8
  limits:
    maxSteps: 50
    maxDurationSec: 420
    maxToolCalls: 50
    maxConsecutiveErrors: 2

workspace:
  path: ../workspace

tools:
  - read
  - search

  - name: git_status
    uses: command
    description: "Show current working tree changes with git status --short."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["status", "--short"]
      timeoutSec: 20

  - name: git_diff_stat
    uses: command
    description: "Show unstaged diffstat to size and cluster large changes before reading hunks."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--stat", "--", "{{path}}"]
      timeoutSec: 20
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to summarize."

  - name: git_diff_name_only
    uses: command
    description: "List changed unstaged files without diff hunks."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--name-only", "--", "{{path}}"]
      timeoutSec: 20
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to list."

  - name: git_diff
    uses: command
    description: "Show unstaged working tree diff. Optionally restrict to one path."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--", "{{path}}"]
      timeoutSec: 30
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to diff."

  - name: git_diff_cached
    uses: command
    description: "Show staged diff. Optionally restrict to one path."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--cached", "--", "{{path}}"]
      timeoutSec: 30
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to diff."

  - name: git_diff_cached_stat
    uses: command
    description: "Show staged diffstat to size and cluster large staged changes before reading hunks."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--cached", "--stat", "--", "{{path}}"]
      timeoutSec: 20
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to summarize."

  - name: git_diff_cached_name_only
    uses: command
    description: "List changed staged files without diff hunks."
    capabilities: [workspaceRead]
    command:
      run: git
      args: ["diff", "--cached", "--name-only", "--", "{{path}}"]
      timeoutSec: 20
    input:
      schema:
        type: object
        properties:
          path:
            type: string
            default: "."
            description: "Optional repository-relative path to list."

permissions:
  access: readOnly
  approval: never

output:
  name: code_review_result
  schema:
    type: object
    required: [summary, findings, residual_risk]
    additionalProperties: false
    properties:
      summary:
        type: string
      findings:
        type: array
        items:
          type: object
          required:
            - severity
            - file
            - line
            - title
            - evidence
            - impact
            - recommendation
          additionalProperties: false
          properties:
            severity:
              type: string
              enum: [P0, P1, P2, P3]
            file:
              type: string
            line:
              type: integer
              description: "Use a 1-based line number when there is a specific line; use 0 for file-level findings."
            title:
              type: string
            evidence:
              type: string
            impact:
              type: string
            recommendation:
              type: string
      residual_risk:
        type: string
