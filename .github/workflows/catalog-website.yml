name: Catalog and Website

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-website.yml"
      - "catalog/**"
      - "website/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/catalog-website.yml"
      - "catalog/**"
      - "website/**"
  workflow_dispatch:

concurrency:
  group: catalog-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Validate catalog packages
        run: |
          set -euo pipefail
          for manifest in catalog/*/*/jeju.package.yaml; do
            go run ./cmd/jeju package validate "$(dirname "$manifest")"
          done

  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Check registry package resolution
        run: |
          set -euo pipefail
          JEJU_CATALOG_LOCAL_SOURCES=1 npm run generate:catalog
          package_dir="$(mktemp -d)"
          while IFS= read -r ref; do
            JEJU_PACKAGES_DIR="$package_dir" \
            JEJU_REGISTRY_INDEX="$PWD/public/registry/index.yaml" \
              go run ../cmd/jeju package add "$ref"
          done < <(node scripts/list-catalog-refs.mjs)
        working-directory: website

      # Deploy runs only on master pushes (or manual dispatch) and only once
      # the Cloudflare secrets exist, so CI stays green before the Pages
      # project, DNS for jeju.rickoyu.com, and secrets are set up.
      - name: Check deploy credentials
        id: cf
        if: github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy secrets are incomplete; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure Cloudflare Pages project
        id: pages
        if: github.ref == 'refs/heads/master' && steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          list_projects() {
            npx --yes wrangler@latest pages project list --json
          }
          project_exists() {
            node -e '
              const fs = require("node:fs");
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              const projects = Array.isArray(data) ? data : data.result || [];
              process.exit(projects.some((project) => project.name === "jeju") ? 0 : 1);
            '
          }
          project_host() {
            node -e '
              const fs = require("node:fs");
              const data = JSON.parse(fs.readFileSync(0, "utf8"));
              const projects = Array.isArray(data) ? data : data.result || [];
              const project = projects.find((item) => item.name === "jeju");
              const domains = project?.domains || [];
              const host = project?.subdomain || domains.find((domain) => domain.endsWith(".pages.dev")) || "";
              if (!host) process.exit(1);
              process.stdout.write(String(host).replace(/^https?:\/\//, "").replace(/\/$/, ""));
            '
          }

          list_projects > /tmp/cf-pages-projects.json
          if project_exists < /tmp/cf-pages-projects.json; then
            echo "Cloudflare Pages project jeju already exists."
          else
            npx --yes wrangler@latest pages project create jeju --production-branch=master
            list_projects > /tmp/cf-pages-projects.json
          fi
          host="$(project_host < /tmp/cf-pages-projects.json)"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages host: https://$host" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch published registry baseline
        if: github.event_name != 'pull_request'
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          set -euo pipefail
          curl -fsSL https://jeju.rickoyu.com/registry/index.yaml -o /tmp/jeju-published-index.yaml && exit 0
          if [ -n "$PAGES_HOST" ]; then
            curl -fsSL "https://$PAGES_HOST/registry/index.yaml" -o /tmp/jeju-published-index.yaml || true
          fi

      - name: Build website
        run: npm run build
        working-directory: website
        env:
          JEJU_CATALOG_LOCAL_SOURCES: ${{ github.event_name == 'pull_request' && '1' || '' }}
          JEJU_CATALOG_BASE_INDEX: ${{ github.event_name != 'pull_request' && '/tmp/jeju-published-index.yaml' || '' }}

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/master' && steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=jeju --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test production
        if: github.ref == 'refs/heads/master' && steps.cf.outputs.enabled == 'true'
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          set -euo pipefail
          base="https://$PAGES_HOST"
          for url in \
            "$base/" \
            "$base/registry/index.yaml"; do
            curl --retry 6 --retry-delay 5 --retry-all-errors -fsSI "$url" >/dev/null
          done
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsS "$base/" | grep -q "Jeju"
          index="$(curl --retry 6 --retry-delay 5 --retry-all-errors -fsS "$base/registry/index.yaml")"
          echo "$index" | grep -q "^packages:"
          echo "$index" | grep -q "digest: sha256:"
          if echo "$index" | grep -q "source: /"; then
            echo "deployed registry index contains local filesystem sources" >&2
            exit 1
          fi
