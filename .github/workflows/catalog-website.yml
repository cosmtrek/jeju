name: Catalog and Website

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-website.yml"
      - "catalog/**"
      - "website/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/catalog-website.yml"
      - "catalog/**"
      - "website/**"
  workflow_dispatch:

concurrency:
  group: catalog-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Validate catalog packages
        run: |
          set -euo pipefail
          for manifest in catalog/*/*/jeju.package.yaml; do
            go run ./cmd/jeju package validate "$(dirname "$manifest")"
          done

  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Check registry package resolution
        run: |
          set -euo pipefail
          JEJU_CATALOG_LOCAL_SOURCES=1 npm run generate:catalog
          package_dir="$(mktemp -d)"
          while IFS= read -r ref; do
            JEJU_PACKAGES_DIR="$package_dir" \
            JEJU_REGISTRY_INDEX="$PWD/public/registry/index.yaml" \
              go run ../cmd/jeju package add "$ref"
          done < <(node scripts/list-catalog-refs.mjs)
        working-directory: website

      # Deploy runs only on master pushes (or manual dispatch) and only once
      # the Cloudflare secrets exist, so CI stays green before the Pages
      # project, DNS for jeju.rickoyu.com, and secrets are set up.
      - name: Check deploy credentials
        id: cf
        if: github.ref == 'refs/heads/master'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy secrets are incomplete; skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure Cloudflare Pages project
        if: github.ref == 'refs/heads/master' && steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if npx --yes wrangler@latest pages project create jeju --production-branch=master > /tmp/wrangler-project-create.log 2>&1; then
            cat /tmp/wrangler-project-create.log
          elif grep -q "A project with this name already exists" /tmp/wrangler-project-create.log; then
            echo "Cloudflare Pages project jeju already exists."
          else
            cat /tmp/wrangler-project-create.log >&2
            exit 1
          fi

      - name: Fetch published registry baseline
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 3 --retry-all-errors -fsSL \
            https://jeju.rickoyu.com/registry/index.yaml \
            -o /tmp/jeju-published-index.yaml || true

      - name: Build website
        run: npm run build
        working-directory: website
        env:
          JEJU_CATALOG_LOCAL_SOURCES: ${{ github.event_name == 'pull_request' && '1' || '' }}
          JEJU_CATALOG_BASE_INDEX: ${{ github.event_name != 'pull_request' && '/tmp/jeju-published-index.yaml' || '' }}

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/master' && steps.cf.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=jeju --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test production
        if: github.ref == 'refs/heads/master' && steps.cf.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          base="https://jeju.rickoyu.com"
          for url in \
            "$base/" \
            "$base/registry/index.yaml"; do
            curl --retry 6 --retry-delay 5 --retry-all-errors -fsSI "$url" >/dev/null
          done
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsS "$base/" | grep -q "Jeju"
          index="$(curl --retry 6 --retry-delay 5 --retry-all-errors -fsS "$base/registry/index.yaml")"
          echo "$index" | grep -q "^packages:"
          echo "$index" | grep -q "digest: sha256:"
          if echo "$index" | grep -q "source: /"; then
            echo "deployed registry index contains local filesystem sources" >&2
            exit 1
          fi
