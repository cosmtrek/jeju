name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "tests/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/ci.yml"
      - ".goreleaser.yaml"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Snapshot release build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
